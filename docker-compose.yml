services:
  migrate:
    image: ${IMAGE:-ghcr.io/diyanqi/walinex:latest}
    command: sh -c "node scripts/wait-for-db.mjs && pnpm db:deploy && pnpm db:seed"
    environment: &app_env
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://localhost:6379}
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://waline.infvar.com}
      NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN:-waline.infvar.com}
      NEXT_PUBLIC_INSTANCE_DOMAIN: ${NEXT_PUBLIC_INSTANCE_DOMAIN:-instance.waline.infvar.com}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      CAP_SECRET: ${CAP_SECRET:?set CAP_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      EPAY_PID: ${EPAY_PID:-}
      EPAY_KEY: ${EPAY_KEY:-}
      EPAY_GATEWAY: ${EPAY_GATEWAY:-}
      AI_MODERATION_BASE_URL: ${AI_MODERATION_BASE_URL:-https://api.openai.com/v1}
      AI_MODERATION_MODEL: ${AI_MODERATION_MODEL:-gpt-4o-mini}
      AI_MODERATION_API_KEY: ${AI_MODERATION_API_KEY:-}
      AI_MODERATION_SPAM_THRESHOLD: ${AI_MODERATION_SPAM_THRESHOLD:-0.6}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
    restart: "no"

  app:
    image: ${IMAGE:-ghcr.io/diyanqi/walinex:latest}
    command: pnpm start
    ports:
      - "${APP_PORT:-3033}:3000"
    environment: *app_env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 6

networks:
  default:
    external: true
    name: 1panel-network
